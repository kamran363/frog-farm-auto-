
name: Frog Farm daily posts
on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '30 2 * * *'
    - cron: '0 4 * * *'
    - cron: '30 5 * * *'
    - cron: '0 7 * * *'
    - cron: '30 8 * * *'
    - cron: '0 10 * * *'
    - cron: '30 11 * * *'
    - cron: '0 13 * * *'
    - cron: '30 14 * * *'
    - cron: '0 16 * * *'
    - cron: '30 17 * * *'
    - cron: '0 19 * * *'
    - cron: '30 20 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Post next queued item
        env:
          PAGE_ID: '61594766076527'
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 scripts/post.py && git config user.name "ff-auto" && git config user.email "ff-auto@users.noreply.github.com" && git add content/state.json && git diff --cached --quiet || git commit -m "advance queue" && git push
